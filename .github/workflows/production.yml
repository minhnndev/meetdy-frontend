name: Preview Meetdy Frontend

on:
  push:
    branches:
      - master

env:
  APP_NAME: meetdy-frontend
  BASE_DOMAIN: meetdy.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Apply configuration
      run: |
        git clone https://oauth2:${{ secrets.CONFIG_REPOSITORY_TOKEN }}@github.com/meetdy/infrastructure-config.git
        [ -e .env ] && rm .env
        [ -e Dockerfile ] && rm Dockerfile
        [ -e nginx.conf ] && rm nginx.conf
        [ -e .dockerignore ] && rm .dockerignore
        cp -a infrastructure-config/meetdy-frontend/. ./

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Set version variable
      id: vars
      run: echo "VERSION=1-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag nghiaphamln/${{ env.APP_NAME }}:${{ env.VERSION }}

    - name: Push the Docker image to Docker Hub
      run: |
        docker push nghiaphamln/${{ env.APP_NAME }}:${{ env.VERSION }}

    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Clean up old namespaces
      run: |
        CURRENT_NAMESPACE="${{ env.APP_NAME }}-preview-${{ env.VERSION }}"
        kubectl get namespaces --no-headers -o custom-columns=:metadata.name | grep "${{ env.APP_NAME }}-preview" | grep -v "${CURRENT_NAMESPACE}" | xargs -r kubectl delete namespace
        echo "Old namespaces cleaned up."

    - name: Deploy to Kubernetes
      run: |
        PREVIEW_NAMESPACE="${{ env.APP_NAME }}-preview-${{ env.VERSION }}"
        kubectl create namespace ${PREVIEW_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
        
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ env.APP_NAME }}-preview
          namespace: ${PREVIEW_NAMESPACE}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${{ env.APP_NAME }}-preview
          template:
            metadata:
              labels:
                app: ${{ env.APP_NAME }}-preview
            spec:
              containers:
              - name: ${{ env.APP_NAME }}-preview
                image: nghiaphamln/${{ env.APP_NAME }}:${{ env.VERSION }}
                ports:
                - containerPort: 80
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: ${{ env.APP_NAME }}-preview
          namespace: ${PREVIEW_NAMESPACE}
        spec:
          selector:
            app: ${{ env.APP_NAME }}-preview
          ports:
          - protocol: TCP
            port: 80
            targetPort: 80
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${{ env.APP_NAME }}-preview
          namespace: ${PREVIEW_NAMESPACE}
        spec:
          ingressClassName: nginx
          rules:
          - host: preview-${{ env.VERSION }}.${{ env.BASE_DOMAIN }}
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ env.APP_NAME }}-preview
                    port:
                      number: 80
        EOF
        
        echo "Preview deployed to https://preview-${{ env.VERSION }}.${{ env.BASE_DOMAIN }}"
