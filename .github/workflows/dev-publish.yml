name: Meetdy Frontend Dev Environment

on:
  push:
    branches:
      - dev

env:
  APP_NAME: meetdy-frontend-dev
  BASE_DOMAIN: meetdy.com
  ENVIRONMENT: Dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Apply configuration
      run: |
        git clone https://oauth2:${{ secrets.CONFIG_REPOSITORY_TOKEN }}@github.com/meetdy/infrastructure.git
        [ -e .env ] && rm .env
        [ -e Dockerfile ] && rm Dockerfile
        [ -e nginx.conf ] && rm nginx.conf
        [ -e .dockerignore ] && rm .dockerignore
        cp -a infrastructure/dev/meetdy-frontend/. ./

    # 🧩 Login to GHCR
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 🧱 Set version variable
    - name: Set version variable
      id: vars
      run: echo "VERSION=1-${{ github.run_number }}" >> $GITHUB_ENV

    # 🏗️ Build Docker image
    - name: Build Docker image
      run: |
        IMAGE_NAME=ghcr.io/${{ github.repository }}
        docker build . --file Dockerfile \
          --tag $IMAGE_NAME:dev-1.${{ env.VERSION }} \
          --tag $IMAGE_NAME:dev-latest

    # 🚀 Push to GHCR
    - name: Push Docker image to GHCR
      run: |
        IMAGE_NAME=ghcr.io/${{ github.repository }}
        docker push $IMAGE_NAME:dev-1.${{ env.VERSION }}
        docker push $IMAGE_NAME:dev-latest

    # ⚙️ Set up kubeconfig
    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    # 🔁 Restart deployment in k3s
    - name: Update Deployment in K3s
      run: |
        kubectl rollout restart deployment/${{ env.APP_NAME }} -n meetdy-develop
